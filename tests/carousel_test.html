<body style="overflow-x: hidden;">
    <h1>CAROUSEL TEST</h1>
    <p>here will be a carousel</p>
    <p>Also, this is an excuse for putting a lot of kimiko images here, uwu</p>
    <hr>
    <hr>

    <div id="carousel-container">
        <ul class="carousel">
            <li><a href="../assets/example_images/kimiko_example_img (1).jpg"><img src="../assets/example_images/kimiko_example_img (1).jpg" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (2).jpg"><img src="../assets/example_images/kimiko_example_img (2).jpg" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (3).jpg"><img src="../assets/example_images/kimiko_example_img (3).jpg" alt="kimiko"></a></li>
        </ul>
        <img class="scroll-button left" src="../assets/elements/sunset_web_elements_022.png" alt="scroll-button">
        <img class="scroll-button right" src="../assets/elements/sunset_web_elements_022.png" alt="scroll-button">
        <script>
            document.querySelectorAll('.scroll-button').forEach(button => {
                button.addEventListener('click', () => {
                    const carousel = document.querySelector('.carousel');
                    const scrollAmount = carousel.clientWidth; // Ancho visible del carrusel

                    if (button.classList.contains('right')) {
                        carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    } else {
                        carousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                });
            });
        </script>
    </div>

    <div id="carousel-container">
        <ul class="carousel">
            <li><a href="../assets/example_images/kimiko_example_img (1).png"><img src="../assets/example_images/kimiko_example_img (1).png" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (2).png"><img src="../assets/example_images/kimiko_example_img (2).png" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (3).png"><img src="../assets/example_images/kimiko_example_img (3).png" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (4).png"><img src="../assets/example_images/kimiko_example_img (4).png" alt="kimiko"></a></li>
            <li><a href="../assets/example_images/kimiko_example_img (5).png"><img src="../assets/example_images/kimiko_example_img (5).png" alt="kimiko"></a></li>
        </ul>
        <img class="scroll-button left" src="../assets/elements/sunset_web_elements_022.png" alt="scroll-button">
        <img class="scroll-button right" src="../assets/elements/sunset_web_elements_022.png" alt="scroll-button">
        <script>
            document.querySelectorAll('.scroll-button').forEach(button => {
                button.addEventListener('click', () => {
                    const carouselContainer = button.closest('#carousel-container');
                    const carousel = carouselContainer.querySelector('.carousel');
                    const scrollAmount = carousel.clientWidth;

                    if (button.classList.contains('right')) {
                        carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    } else {
                        carousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    }
                });
            });
        </script>
    </div>
