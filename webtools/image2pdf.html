<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de PDF con Imágenes</title>
  <!-- Incluimos la librería jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Incluimos la librería SortableJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      padding: 20px;
      color: #333;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 20px;
    }
    .controls input[type="file"] {
      padding: 10px;
      border: 2px solid #007bff;
      border-radius: 4px;
      background-color: #fff;
      cursor: pointer;
    }
    .controls button {
      padding: 10px 20px;
      border: none;
      background-color: #007bff;
      color: #fff;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 200ms;
    }
    .controls button:hover {
      background-color: #0056b3;
    }
    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      border: 2px dashed #ddd;
      border-radius: 8px;
      padding: 15px;
      min-height: 200px;
      background: #fafafa;
    }
    .img-container {
      position: relative;
      width: 150px;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      background: #fff;
      cursor: grab;
      transition: transform 0.2s;
    }
    .img-container:active {
      cursor: grabbing;
    }
    .img-container:hover {
      transform: scale(1.02);
    }
    .img-container img {
      width: 100%;
      display: block;
    }
    /* Indicador en el centro de la imagen */
    .handle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      padding: 2px 8px;
      font-size: 18px;
      border-radius: 50%;
      pointer-events: none; /* Para que no interfiera en el arrastre */
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Generador de PDF con Imágenes</h2>
    <div class="controls">
      <input type="file" id="fileInput" accept=".png,.jpg,.jpeg" multiple>
      <button id="generatePdf">Generar PDF</button>
    </div>
    <div id="preview"></div>
    <div class="footer">Arrastra cualquier imagen para reordenarlas antes de generar el PDF.</div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const generatePdfBtn = document.getElementById('generatePdf');

    // Array para almacenar objetos de imagen con su dataURL y dimensiones.
    let imagesData = [];

    // Cuando se selecciona archivos
    fileInput.addEventListener('change', (event) => {
      // Reiniciamos el preview y el array
      preview.innerHTML = "";
      imagesData = []; 

      let files = Array.from(event.target.files);
      // Filtra archivos que sean imágenes
      files = files.filter(file => file.type.match("image.*"));
      if (files.length === 0) return;

      files.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataURL = e.target.result;
          // Creamos un objeto Image para obtener dimensiones reales
          const img = new Image();
          img.onload = function() {
            imagesData.push({
              fileName: file.name,
              dataURL: dataURL,
              width: img.naturalWidth,
              height: img.naturalHeight
            });
            // Creamos la vista previa y usamos el índice según se va agregando.
            createPreviewItem(dataURL, imagesData.length - 1);
          };
          img.src = dataURL;
        };
        reader.readAsDataURL(file);
      });
    });

    function createPreviewItem(src, index) {
      const container = document.createElement('div');
      container.className = 'img-container';
      container.setAttribute('data-index', index);
      
      // Indicador decorativo en el centro de la imagen
      const handle = document.createElement('div');
      handle.className = 'handle';
      handle.textContent = '≡';

      const img = document.createElement('img');
      img.src = src;
      
      container.appendChild(img);
      container.appendChild(handle);
      
      preview.appendChild(container);
    }

    // Configuramos Sortable sin especificar "handle", de manera que toda la zona sea arrastrable.
    Sortable.create(preview, {
      animation: 150
    });

    generatePdfBtn.addEventListener('click', async () => {
      if (preview.children.length === 0) {
        alert("No hay imágenes para procesar.");
        return;
      }
      
      // Extraemos el orden del DOM
      let orderedData = [];
      const containers = preview.querySelectorAll('.img-container');
      containers.forEach(container => {
        const dataIndex = container.getAttribute('data-index');
        orderedData.push(imagesData[dataIndex]);
      });
      
      // Creamos el PDF. Cada imagen ocupará una página.
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'px',
        format: 'a4'
      });
      
      // Dimensiones de la página A4 en px (según jsPDF, normalmente 595x842)
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      for (let i = 0; i < orderedData.length; i++) {
        const imgData = orderedData[i];
        // Calculamos el tamaño de la imagen para que se ajuste a la página manteniendo sus proporciones.
        let imgWidth = imgData.width;
        let imgHeight = imgData.height;
        const widthRatio = pageWidth / imgWidth;
        const heightRatio = pageHeight / imgHeight;
        const scale = Math.min(widthRatio, heightRatio, 1);
        imgWidth = imgWidth * scale;
        imgHeight = imgHeight * scale;
        // Centramos la imagen
        const x = (pageWidth - imgWidth) / 2;
        const y = (pageHeight - imgHeight) / 2;
        
        // Agregamos la imagen a la página.
        pdf.addImage(imgData.dataURL, imgData.dataURL.split(';')[0].split(':')[1], x, y, imgWidth, imgHeight);
        // Si no es la última imagen, se agrega una nueva página.
        if (i < orderedData.length - 1) {
          pdf.addPage();
        }
      }
      
      // Descargamos el PDF
      pdf.save("imagenes.pdf");
    });
  </script>
</body>
</html>
